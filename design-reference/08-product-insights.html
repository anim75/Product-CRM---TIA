<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Product insights and assignment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#F8F9FF;color:#1E1B4B}
a{color:#2563EB;text-decoration:none}a:hover{color:#1D4ED8}
input,select,textarea,button{font-family:inherit}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.1)}}
@keyframes floatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,30px) scale(0.92)}}
@keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.blobA{animation:floatA 16s ease-in-out infinite}
.blobB{animation:floatB 20s ease-in-out infinite}
.shine{animation:shimmer 2.8s ease-in-out infinite}
.ring{animation:spin 9s linear infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.rise{animation:rise .6s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>
html{background:#E9E8F5}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:0;background:#E9E8F5 !important}
.artboard{width:1440px;box-shadow:0 30px 80px rgba(30,27,75,.18);}
</style>
</head>
<body>
<template id="tpl"><div style="width: 1440px; height: 1500px; box-sizing: border-box; position: relative; overflow: hidden; background: #F8F9FF; font-family: 'Manrope', sans-serif; color: #1E1B4B">
<div class="blobA" style="position: absolute; top: -160px; right: -120px; width: 520px; height: 520px; border-radius: 999px; background: #C7D2FE; opacity: 0.45; filter: blur(90px)"></div><div class="blobB" style="position: absolute; bottom: -200px; left: 280px; width: 560px; height: 560px; border-radius: 999px; background: #DDD6FE; opacity: 0.5; filter: blur(100px)"></div><div style="position: absolute; inset: 0; background-image: radial-gradient(#DAD6F5 1px, transparent 1px); background-size: 26px 26px; opacity: 0.45"></div><aside style="position: absolute; top: 0; left: 0; bottom: 0; width: 248px; box-sizing: border-box; padding: 24px 16px; background: rgba(243,241,255,0.8); border-right: 1px solid #E6E3FA; display: flex; flex-direction: column; gap: 28px; z-index: 2">
<div style="padding: 0 8px"><div style="display: flex; align-items: center; gap: 12px"><div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #2563EB 0%, #7C3AED 70%, #A78BFA 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(124,58,237,0.3); flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg></div><div style="display: flex; flex-direction: column; line-height: 1.1"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; color: #1E1B4B">Product Growth</span><span style="font-size: 12px; font-weight: 700; color: #7C3AED">with Imtial</span></div></div></div>
<nav aria-label="Main" style="display: flex; flex-direction: column; gap: 4px"><a href="02-dashboard.html" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #475569"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg><span>Dashboard</span></a><a href="08-product-insights.html" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 800; background: linear-gradient(135deg, #DBEAFE 0%, #EDE9FE 100%); color: #2563EB; box-shadow: inset 0 0 0 1px #DCD6FB"><span style="position: absolute; left: -16px; top: 9px; width: 4px; height: 22px; border-radius: 0 4px 4px 0; background: linear-gradient(135deg, #2563EB 0%, #7C3AED 70%, #A78BFA 100%)"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg><span>Products</span></a><a href="04-add-work-item.html" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #475569"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M8 12l3 3 5-6"></path></svg><span>Work Items</span></a><a href="#" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #475569"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg><span>Calendar</span></a><a href="05-meeting-minutes.html" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #475569"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.5-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M17 14.5c2.3.3 4 1.8 4.5 4.5"></path></svg><span>Meetings &amp; MoM</span><span style="margin-left: auto; font-size: 11px; font-weight: 800; color: #FFFFFF; background: #7C3AED; padding: 2px 7px; border-radius: 99px">5</span></a><a href="#" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #475569"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"></path><path d="M15 3v4h4M8 12h8M8 16h6"></path></svg><span>Work Notes</span></a><a href="07-campaigns-roi.html" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #475569"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg><span>Campaigns &amp; ROI</span></a><a href="09-data-analytics.html" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #475569"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg><span>Data Analytics</span></a><a href="#" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #475569"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12l-8.5 8.5a5 5 0 01-7-7L14 5a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 8"></path></svg><span>Files &amp; Links</span></a><a href="#" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #475569"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg><span>Automations</span></a><a href="#" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #475569"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"></path></svg><span>Settings</span></a></nav>
<div style="margin-top: auto; background: rgba(255,255,255,0.88); border: 1px solid #E6E3FA; border-radius: 18px; box-shadow: 0 8px 30px rgba(79,70,229,0.07); padding: 14px; display: flex; align-items: center; gap: 12px">
<div style="position: relative; width: 42px; height: 42px; flex-shrink: 0">
<div class="ring" style="position: absolute; inset: 0; border-radius: 999px; background: conic-gradient(#2563EB, #A78BFA, #DBEAFE, #2563EB)"></div>
<div style="position: absolute; inset: 3px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><div style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg,#3B82F6,#8B5CF6);  color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; flex-shrink: 0">IM</div></div>
<span style="position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 99px; background: #10B981; border: 2px solid #FFFFFF"></span>
</div>
<div style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 800; font-size: 14px">Imtial</span><span style="font-size: 12px; color: #64748B">Product Manager · Admin</span></div>
</div>
</aside><main style="position: absolute; top: 0; left: 248px; right: 0; bottom: 0; box-sizing: border-box; padding: 28px 36px; display: flex; flex-direction: column; gap: 24px; z-index: 1"><header style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: #1E1B4B">Products</h1>
<div style="font-size: 14px; color: #64748B; font-weight: 600">Pick a product to see insights and assign people</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<label style="display: flex; align-items: center; gap: 10px; width: 300px; padding: 10px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E6E3FA; color: #64748B">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" aria-label="Search everything" placeholder="Search anything…" style="border: 0; outline: none; flex-grow: 1; font-size: 14px; background: transparent; color: #1E1B4B">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #F3F1FF; color: #7C3AED">⌘K</span></label>
<button type="button" aria-label="Notifications" style="position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E6E3FA; background: #FFFFFF; color: #1E1B4B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a2 2 0 003.4 0"></path></svg><span class="pulse" style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 99px; background: #F43F5E"></span></button>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; background: linear-gradient(135deg, #2563EB 0%, #7C3AED 70%, #A78BFA 100%); color: #FFFFFF; border: 0; box-shadow: 0 8px 20px rgba(37,99,235,0.25)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New product</button>
</div>
</header>
<section style="background: rgba(255,255,255,0.88); border: 1px solid #E6E3FA; border-radius: 18px; box-shadow: 0 8px 30px rgba(79,70,229,0.07); padding: 20px 24px; display: flex; align-items: center; gap: 24px; position: relative; z-index: 5">
<div style="position: relative">
<button type="button" aria-haspopup="listbox" aria-expanded="{{ openStr }}" onClick="{{ toggleOpen }}" style="display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 10px; border-radius: 18px; border: 1.5px solid {{ selBorder }}; background: #FFFFFF; cursor: pointer; min-width: 420px; text-align: left; box-shadow: {{ selShadow }}">
<span style="width: 54px; height: 54px; border-radius: 15px; background: {{ cur.grad }}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #64748B">SELECT PRODUCT</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: #1E1B4B; line-height: 1.1">{{ cur.name }}</span>
<span style="font-size: 12px; font-weight: 700; color: #7C3AED">{{ cur.tag }}</span>
</span>
<span style="width: 36px; height: 36px; border-radius: 10px; background: #F3F1FF; color: #7C3AED; display: flex; align-items: center; justify-content: center; transform: {{ chevRot }}; transition: transform .25s"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
</button>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div role="listbox" aria-label="Products" class="rise" style="position: absolute; top: calc(100% + 10px); left: 0; width: 460px; padding: 8px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E3FA; box-shadow: 0 24px 60px rgba(30,27,75,0.18); display: flex; flex-direction: column; gap: 4px; z-index: 20">
<div style="padding: 8px 10px 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #64748B">YOUR PRODUCTS · {{ count }}</div>
<sc-for list="{{ list }}" as="p" hint-placeholder-count="4">
<button type="button" role="option" aria-selected="{{ p.selStr }}" onClick="{{ p.pick }}" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; border: 0; cursor: pointer; text-align: left; background: {{ p.rowBg }}">
<span style="width: 38px; height: 38px; border-radius: 11px; background: {{ p.grad }}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><span style="font-size: 14px; font-weight: 800; color: #1E1B4B">{{ p.name }}</span><span style="font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: {{ p.stBg }}; color: {{ p.stFg }}">{{ p.stLabel }}</span></span>
<span style="display: flex; align-items: center; gap: 10px"><span style="flex-grow: 1; height: 6px; border-radius: 99px; background: #EEF0FB; overflow: hidden"><span style="display: block; width: {{ p.pct }}%; height: 100%; border-radius: 99px; background: linear-gradient(135deg, #2563EB 0%, #7C3AED 70%, #A78BFA 100%)"></span></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #1E1B4B; width: 34px; text-align: right">{{ p.pct }}%</span></span>
</span>
</button>
</sc-for>
<div style="margin: 4px 6px 2px; padding-top: 8px; border-top: 1px solid #E6E3FA"><a href="04-add-work-item.html" style="display: flex; align-items: center; gap: 8px; padding: 8px 6px; font-size: 13px; font-weight: 800"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a new product</a></div>
</div>
</sc-if>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; flex-grow: 1">
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; background: {{ cur.stBg }}; color: {{ cur.stFg }}"><span style="width: 6px; height: 6px; border-radius: 9px; background: {{ cur.stFg }}"></span>{{ cur.stLabel }}</span>
<span style="font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 8px; background: #FFE4E6; color: #BE123C">{{ cur.priority }} priority</span>
<span style="font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 8px; background: #F3F1FF; color: #7C3AED">Relevance {{ cur.rel }}/10</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 8px; background: {{ cur.dueBg }}; color: {{ cur.dueFg }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{ cur.daysLeft }} days left</span>
</div>
<div style="display: flex; gap: 10px; flex-shrink: 0">
<a href="03-product-board.html" style="display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E6E3FA; color: #1E1B4B; font-size: 14px; font-weight: 800">Open board <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<button type="button" onClick="{{ toggleAssign }}" style="display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 12px; border: 0; background: linear-gradient(135deg, #2563EB 0%, #7C3AED 70%, #A78BFA 100%); color: #FFFFFF; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(37,99,235,0.25)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.5-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M17 14.5c2.3.3 4 1.8 4.5 4.5"></path></svg>Assign people</button>
</div>
</section>

<sc-if value="{{ flash }}" hint-placeholder-val="{{ false }}">
<div class="rise" role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; background: #D1FAE5; color: #047857; font-size: 14px; font-weight: 800"><span style="width: 24px; height: 24px; border-radius: 99px; background: #10B981; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M8 12l3 3 5-6"></path></svg></span>{{ flashText }}</div>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }

}

  const interp = (s, ctx) => s.replace(HOLE, (_, p) => { const v = get(ctx, p); return v == null ? '' : String(v); });

  function render(node, ctx) {
    if (node.nodeType === 3) return [document.createTextNode(interp(node.nodeValue, ctx))];
    if (node.nodeType !== 1) return [];
    const tag = node.tagName.toLowerCase();

    }
    if (tag === 'sc-if') {

    }
    const el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(node.tagName);
