<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#F8F9FF;color:#1E1B4B}
a{color:#2563EB;text-decoration:none}a:hover{color:#1D4ED8}
input,select,textarea,button{font-family:inherit}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.1)}}
@keyframes floatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,30px) scale(0.92)}}
@keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.blobA{animation:floatA 16s ease-in-out infinite}
.blobB{animation:floatB 20s ease-in-out infinite}
.shine{animation:shimmer 2.8s ease-in-out infinite}
.ring{animation:spin 9s linear infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.rise{animation:rise .6s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

</sc-for></div>
</sc-for>
</div>

</main>
</div></template>
<div class="artboard" id="root"></div>
<script>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    let changed = false;
    for (const k in patch) if (this.state[k] !== patch[k]) changed = true;
    Object.assign(this.state, patch);
    if (changed && this._render) this._render();
  }
}
(function () {
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const get = (ctx, p) => {
    p = p.trim();
    if (p === 'true') return true;
    if (p === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(p)) return Number(p);
    return p.split('.').reduce((o, k) => (o == null ? undefined : o[k]), ctx);
  };
  const whole = (s) => { const m = s.match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/); return m ? m[1] : null; };
  const interp = (s, ctx) => s.replace(HOLE, (_, p) => { const v = get(ctx, p); return v == null ? '' : String(v); });

  function render(node, ctx) {
    if (node.nodeType === 3) return [document.createTextNode(interp(node.nodeValue, ctx))];
    if (node.nodeType !== 1) return [];
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = get(ctx, whole(node.getAttribute('list')) || '') || [];
      const as = node.getAttribute('as') || 'item';
      const out = [];
      Array.from(list).forEach((item, i) => {
        const c = Object.create(ctx); c[as] = item; c.$index = i;
        node.childNodes.forEach((ch) => out.push(...render(ch, c)));
      });
      return out;
    }
    if (tag === 'sc-if') {
      const v = get(ctx, whole(node.getAttribute('value')) || '');
      if (!v) return [];
      const out = [];
      node.childNodes.forEach((ch) => out.push(...render(ch, ctx)));
      return out;
    }
    const el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(node.tagName);
    for (const a of Array.from(node.attributes)) {
      if (/^hint-/.test(a.name)) continue;
      if (/^on[a-z]+$/.test(a.name)) {
        const fn = get(ctx, whole(a.value) || '');
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn);
        continue;
      }
      el.setAttribute(a.name, a.value.includes('{{') ? interp(a.value, ctx) : a.value);
    }
    const kids = tag === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach((ch) => render(ch, ctx).forEach((n) => el.appendChild(n)));
    return [el];
  }

  window.mountDC = function (Component, tplId, rootId) {
    const tpl = document.getElementById(tplId).content;
    const root = document.getElementById(rootId);
    const inst = new Component({});
    inst._render = () => {
      const vals = inst.renderVals();
      const frag = document.createDocumentFragment();
      tpl.childNodes.forEach((ch) => render(ch, vals).forEach((n) => frag.appendChild(n)));
      root.replaceChildren(frag);
    };
    inst._render();
  };
})();

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { m: 2, hTr: -1, hWt: -1, table: false };
}
renderVals() {
var self = this, s = this.state;
var MONTHS = [{ label: 'Jul 2026', short: 'JUL', days: 31, s0: 41200, g: 96, t0: 2900, mob: 71, churn: [3.1, 2.9, 3.4, 3.0, 2.8] },
{ label: 'Aug 2026', short: 'AUG', days: 31, s0: 44180, g: 104, t0: 3250, mob: 73, churn: [2.9, 2.7, 2.6, 2.8, 2.5] },
{ label: 'Sep 2026', short: 'SEP', days: 30, s0: 47400, g: 112, t0: 3600, mob: 76, churn: [2.6, 2.4, 2.7, 2.3, 2.2] }];
function rnd(seed) { var x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); }
function fmt(n) { return n >= 1000000 ? (n / 1000000).toFixed(2) + 'M' : (n >= 10000 ? (n / 1000).toFixed(1) + 'K' : n.toLocaleString('en-US')); }
function build(mi) {
var M = MONTHS[mi], subs = [], act = [], vis = [], v = M.s0;
for (var d = 0; d < M.days; d++) {
v += Math.round(M.g * (0.6 + rnd(mi * 100 + d) * 0.8));
subs.push(v);
var wk = (d + mi * 3) % 7, weekend = (wk === 5 || wk === 6);
act.push(Math.round(v * (0.43 + rnd(mi * 50 + d + 7) * 0.05) * (weekend ? 1.06 : 1)));
vis.push(Math.round((M.t0 + d * 14) * (weekend ? 0.8 : 1) * (0.88 + rnd(mi * 70 + d + 3) * 0.24)));
}
return { M: M, subs: subs, act: act, vis: vis };
}
var cur = build(s.m), prev = s.m > 0 ? build(s.m - 1) : null;
var n = cur.subs.length, M = cur.M;
function niceMax(x) { var p = Math.pow(10, Math.floor(Math.log10(x))); var f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : f <= 6 ? 6 : f <= 8 ? 8 : 10) * p; }
function chart(seriesList, colors, hover, setKey, fmtFn) {
var mx = 0; seriesList.forEach(function (a) { a.forEach(function (x) { if (x > mx) mx = x; }); });
var top = niceMax(mx * 1.08);
function X(i) { return i / (n - 1) * 1000; }
function Y(val) { return 1000 - val / top * 1000; }
function path(a) { return a.map(function (val, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(val).toFixed(1); }).join(' '); }
var grid = '', ticks = [];
for (var k = 0; k <= 4; k++) { var yy = 1000 - k * 250; grid += 'M0 ' + yy + ' H1000 '; ticks.push({ top: yy / 10, label: fmt(Math.round(top * k / 4)) }); }
var cols = []; for (var i = 0; i < n; i++) { (function (j) { cols.push({ enter: function () { var o = {}; o[setKey] = j; self.setState(o); } }); })(i); }
var xT = []; [0, 7, 14, 21, n - 1].forEach(function (d) { xT.push(String(d + 1).padStart(2, '0') + ' ' + M.short); });
var h = hover >= 0 && hover < n ? hover : -1;
var o = { grid: grid, yTicks: ticks, xTicks: xT, cols: cols, lineSubs: path(seriesList[0]), areaSubs: path(seriesList[0]) + ' L1000 1000 L0 1000 Z',
lineAct: seriesList[1] ? path(seriesList[1]) : '', hasHover: h >= 0,
leave: function () { var q = {}; q[setKey] = -1; self.setState(q); } };
if (h >= 0) {
o.hx = X(h) / 10; o.tipLeft = X(h) / 10; o.tipShift = h > n * 0.7 ? 'translateX(calc(-100% - 12px))' : 'translateX(12px)';
o.tipDate = String(h + 1).padStart(2, '0') + ' ' + M.label.toUpperCase();
o.tipA = seriesList[0][h].toLocaleString('en-US'); o.tipB = seriesList[1] ? seriesList[1][h].toLocaleString('en-US') : '';
o.dots = seriesList.map(function (a, si) { return { x: X(h) / 10, y: Y(a[h]) / 10, color: colors[si] }; });
}
return o;
}
var tr = chart([cur.subs, cur.act], ['#2563EB', '#EC4899'], s.hTr, 'hTr');
var wt = chart([cur.vis], ['#8B5CF6'], s.hWt, 'hWt');
function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
function avg(a) { return Math.round(sum(a) / a.length); }
function delta(c, p, pct, invert, unit) {
if (p === null) return { delta: '— first month', dFg: '#475569', dBg: '#F1F5F9' };
var d = pct ? (c - p) / p * 100 : c - p;
var good = invert ? d < 0 : d > 0;
var txt = (d > 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1) + (unit || '%') + ' vs last month';
return { delta: txt, dFg: good ? '#047857' : '#BE123C', dBg: good ? '#D1FAE5' : '#FFE4E6' };
}
var subsEnd = cur.subs[n - 1], mau = Math.round(avg(cur.act) * 1.6), churnAvg = sum(M.churn) / M.churn.length;
var pSubs = prev ? prev.subs[prev.subs.length - 1] : null, pMau = prev ? Math.round(avg(prev.act) * 1.6) : null;
var pChurn = prev ? sum(prev.M.churn) / prev.M.churn.length : null;
var newSubs = subsEnd - M.s0 + Math.round(subsEnd * churnAvg / 100), pNew = prev ? pSubs - prev.M.s0 + Math.round(pSubs * pChurn / 100) : null;
var vis = sum(cur.vis), pVis = prev ? sum(prev.vis) : null;
function K(label, value, note, d) { return Object.assign({ label: label, value: value, note: note }, d); }
var k = {
subs: K('Subscriber base', fmt(subsEnd), 'On ' + n + ' ' + M.label, delta(subsEnd, pSubs, true)),
active: K('Monthly active users', fmt(mau), Math.round(mau / subsEnd * 100) + '% of subscribers', delta(mau, pMau, true)),
churn: K('Churn rate', churnAvg.toFixed(1) + '%', 'Average of weekly churn', delta(churnAvg, pChurn, false, true, ' pts')),
newSubs: K('New subscribers', fmt(newSubs), 'Gross adds this month', delta(newSubs, pNew, true)),
traffic: K('Web traffic', fmt(vis), 'Total visits', delta(vis, pVis, true)),
mobile: K('Mobile users', M.mob + '%', (100 - M.mob) + '% on web', delta(M.mob, prev ? prev.M.mob : null, false, false, ' pts'))
};
var cmax = Math.max.apply(null, M.churn) * 1.25;
var churn = M.churn.map(function (c, i) { return { label: c.toFixed(1) + '%', h: Math.round(c / cmax * 100), wk: 'W' + (i + 1), tip: 'Week ' + (i + 1) + ': ' + c.toFixed(1) + '% churn' }; });
var weeks = M.churn.map(function (c, i) {
var a = i * 7, b = Math.min(n, a + 7);
return { label: 'Week ' + (i + 1), subs: cur.subs[b - 1].toLocaleString('en-US'), active: avg(cur.act.slice(a, b)).toLocaleString('en-US'), visits: sum(cur.vis.slice(a, b)).toLocaleString('en-US'), churn: c.toFixed(1) + '%' };
});
var mobN = Math.round(mau * M.mob / 100);
var dev = { mobile: M.mob, web: 100 - M.mob, mobileN: mobN.toLocaleString('en-US'), webN: (mau - mobN).toLocaleString('en-US') };
var LOC = [['Dhaka', 42, 41, 40], ['Chattogram', 17, 18, 18], ['Khulna', 10, 10, 11], ['Rajshahi', 9, 9, 9], ['Sylhet', 9, 9, 8], ['Rangpur', 6, 6, 7], ['Others', 7, 7, 7]];
var locMax = 45;
var loc = LOC.map(function (r) { var p = r[1 + s.m]; return { name: r[0], w: Math.round(p / locMax * 100), label: fmt(Math.round(subsEnd * p / 100)) }; });
var AGE = [['18–24', 30, 31, 33], ['25–34', 39, 38, 37], ['35–44', 18, 18, 17], ['45–54', 9, 9, 9], ['55+', 4, 4, 4]];
var age = AGE.map(function (r) { var p = r[1 + s.m]; return { name: r[0], label: p + '%', h: Math.round(p / 42 * 100) }; });
var GEN = [['Male', '#2563EB', 66, 65, 63], ['Female', '#EC4899', 32, 33, 35], ['Other / not stated', '#8B5CF6', 2, 2, 2]];
var gender = GEN.map(function (r) { var p = r[2 + s.m]; return { name: r[0], color: r[1], pct: p, n: Math.round(subsEnd * p / 100).toLocaleString('en-US') }; });
var PL = [['Facebook', '#2563EB'], ['TikTok', '#EC4899'], ['Instagram', '#8B5CF6'], ['YouTube', '#0891B2']];
var SOC = { views: [[820000, 610000, 240000, 310000], [905000, 760000, 262000, 330000], [980000, 940000, 281000, 355000]],
reactions: [[41000, 52000, 15800, 9200], [44500, 61000, 16900, 9900], [47800, 73400, 18200, 10600]],
shares: [[6200, 8100, 1900, 1300], [6700, 9800, 2100, 1400], [7300, 12100, 2300, 1500]] };
function socRows(key) { var a = SOC[key][s.m], mx = Math.max.apply(null, a); return a.map(function (v, i) { return { name: PL[i][0], color: PL[i][1], w: Math.round(v / mx * 100), label: fmt(v) }; }); }
var socMetrics = [{ name: 'Views', rows: socRows('views') }, { name: 'Reactions', rows: socRows('reactions') }, { name: 'Shares', rows: socRows('shares') }];
function tot(key, mi) { return sum(SOC[key][mi]); }
function sd(key) { return s.m > 0 ? delta(tot(key, s.m), tot(key, s.m - 1), true) : delta(0, null); }
var eng = (tot('reactions', s.m) + tot('shares', s.m)) / tot('views', s.m) * 100;
var pEng = s.m > 0 ? (tot('reactions', s.m - 1) + tot('shares', s.m - 1)) / tot('views', s.m - 1) * 100 : null;
var soc = { views: Object.assign({ label: 'Total views', value: fmt(tot('views', s.m)) }, sd('views')),
reactions: Object.assign({ label: 'Total reactions', value: fmt(tot('reactions', s.m)) }, sd('reactions')),
shares: Object.assign({ label: 'Total shares', value: fmt(tot('shares', s.m)) }, sd('shares')),
eng: Object.assign({ label: 'Engagement rate', value: eng.toFixed(1) + '%' }, delta(eng, pEng, false, false, ' pts')) };
var on = 'padding: 8px 14px; border-radius: 9px; border: 0; cursor: pointer; font-size: 13px; font-weight: 800; background: linear-gradient(135deg, #2563EB 0%, #7C3AED 70%, #A78BFA 100%); color: #FFFFFF';
var off = 'padding: 8px 14px; border-radius: 9px; border: 0; cursor: pointer; font-size: 13px; font-weight: 700; background: transparent; color: #475569';
var months = MONTHS.map(function (mm, i) { return { label: mm.label, style: i === s.m ? on : off, selStr: i === s.m ? 'true' : 'false', pick: function () { self.setState({ m: i, hTr: -1, hWt: -1 }); } }; });
var ib = 'width: 34px; height: 30px; border-radius: 8px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; ';
return {
months: months, range: '01 ' + M.short + ' – ' + n + ' ' + M.short + ' ' + M.label.slice(-4),
k: k, tr: tr, wt: wt, churn: churn, weeks: weeks, dev: dev, loc: loc, age: age, gender: gender,
platforms: PL.map(function (p) { return { name: p[0], color: p[1] }; }), socMetrics: socMetrics, soc: soc,
chartOn: !s.table, tableOn: s.table, chartOnStr: s.table ? 'false' : 'true', tableOnStr: s.table ? 'true' : 'false',
chartBtn: ib + (s.table ? 'background: transparent; color: #475569' : 'background: #F3F1FF; color: #7C3AED'),
tableBtn: ib + (s.table ? 'background: #F3F1FF; color: #7C3AED' : 'background: transparent; color: #475569'),
showChart: function () { self.setState({ table: false }); }, showTable: function () { self.setState({ table: true }); }
};
}
}
mountDC(Component, "tpl", "root");
</script>
