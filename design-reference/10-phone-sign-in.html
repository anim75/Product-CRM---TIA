<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#F8F9FF;color:#1E1B4B}
a{color:#2563EB;text-decoration:none}a:hover{color:#1D4ED8}
input,select,textarea,button{font-family:inherit}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.1)}}
@keyframes floatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,30px) scale(0.92)}}
@keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.blobA{animation:floatA 16s ease-in-out infinite}
.blobB{animation:floatB 20s ease-in-out infinite}
.shine{animation:shimmer 2.8s ease-in-out infinite}
.ring{animation:spin 9s linear infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.rise{animation:rise .6s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>
html{background:#E9E8F5}

<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #475569"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #2563EB">Remember me</label>
<a href="11-phone-dashboard.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border-radius: 14px; background: linear-gradient(135deg, #2563EB 0%, #7C3AED 70%, #A78BFA 100%); color: #FFFFFF; font-size: 16px; font-weight: 800; box-shadow: 0 14px 30px rgba(37,99,235,0.3)">Sign in <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
